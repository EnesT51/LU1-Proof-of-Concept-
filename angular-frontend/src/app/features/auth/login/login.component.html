<div class="container vh-100 d-flex justify-content-center align-items-center">
    <div class="card shadow-lg border-0 rounded-4 backdrop-blur-lg"
        style="max-width: 900px; width: 100%; background: rgba(30, 30, 30, 0.9); color: #f1f1f1; box-shadow: 0 0 30px rgba(0, 255, 255, 0.1);">
        <div class="card-body p-5">
            <h2 class="fw-bold text-center mb-4 text-light">Inloggen</h2>
            <p class="text-center text-secondary mb-5">Voer je inloggegevens in om verder te gaan</p>

            <div class="alert alert-danger d-none" id="error-message"></div>

            <form (ngSubmit)="login()" method="POST" novalidate>
                <div class="mb-3">
                    <label class="form-label text-light">Emailadres</label>
                    <input type="email" name="email"
                        class="form-control form-control-lg bg-dark text-light border-secondary"
                        placeholder="naam@email.com" [(ngModel)]="loginForm.email" />
                </div>
                <div class="mb-4">
                    <label class="form-label text-light">Wachtwoord</label>
                    <input type="password" name="password"
                        class="form-control form-control-lg bg-dark text-light border-secondary" placeholder="••••••••"
                        [(ngModel)]="loginForm.password" />
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm"
                    style="background: linear-gradient(90deg, #007bff, #00bcd4); border: none;">
                    Inloggen
                </button>
            </form>

            <div class="text-center mt-4">
                <p class="mb-1 text-secondary">Geen account?</p>
                <a routerLink="/auth/register" class="fw-bold text-decoration-none text-info">Registreer hier</a>
            </div>
        </div>
    </div>
</div>
