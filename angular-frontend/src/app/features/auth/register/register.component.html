<div class="container vh-100 d-flex justify-content-center align-items-center">
    <div class="card shadow-lg border-0 rounded-4 backdrop-blur-lg"
        style="max-width: 900px; width: 100%; background: rgba(30, 30, 30, 0.9); color: #f1f1f1; box-shadow: 0 0 30px rgba(0, 255, 255, 0.1);">
        <div class="card-body p-5">
            <h2 class="fw-bold text-center mb-4 text-light">Registreren</h2>
            <p class="text-center text-secondary mb-4">Maak een nieuw account aan om verder te gaan</p>

            <form (ngSubmit)="register()" method="POST" novalidate>
                <div class="mb-3">
                    <label class="form-label text-light">Voornaam</label>
                    <input type="text" name="name"
                        class="form-control form-control-lg bg-dark text-light border-secondary" placeholder="Voornaam"
                        [(ngModel)]="registerForm.name" />
                </div>

                <div class="mb-3">
                    <label class="form-label text-light">Achternaam</label>
                    <input type="text" name="surname"
                        class="form-control form-control-lg bg-dark text-light border-secondary"
                        placeholder="Achternaam" [(ngModel)]="registerForm.surname" />
                </div>

                <div class="mb-3">
                    <label class="form-label text-light">Emailadres</label>
                    <input type="email" name="email"
                        class="form-control form-control-lg bg-dark text-light border-secondary"
                        placeholder="naam@email.com" [(ngModel)]="registerForm.email" />
                </div>

                <div class="mb-3">
                    <label class="form-label text-light">Wachtwoord</label>
                    <input type="password" name="password"
                        class="form-control form-control-lg bg-dark text-light border-secondary" placeholder="••••••••"
                        [(ngModel)]="registerForm.password" />
                </div>

                <div class="mb-3 position-relative">
                    <label class="form-label text-light">Geboortedatum</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-info">
                            <i class="bi bi-calendar-date"></i>
                        </span>
                        <input type="date" name="birthdate"
                            class="form-control form-control-lg bg-dark text-light border-secondary date-input"
                            [(ngModel)]="registerForm.birthDate" />
                    </div>
                </div>


                <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm mt-3"
                    style="background: linear-gradient(90deg, #007bff, #00bcd4); border: none;">
                    Registreer
                </button>
            </form>

            <div class="text-center mt-4">
                <p class="mb-1 text-secondary">Heb je al een account?</p>
                <a routerLink="/auth/login" class="fw-bold text-decoration-none text-info">Inloggen</a>
            </div>
        </div>
    </div>
</div>
