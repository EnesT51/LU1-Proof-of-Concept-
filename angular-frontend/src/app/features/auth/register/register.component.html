<div class="container vh-100 d-flex justify-content-center align-items-center">
    <div class="card shadow-lg border-0 rounded-4" style="max-width: 900px; width: 100%;">
        <div class="card-body p-5">
            <h2 class="fw-bold text-center mb-4">Registreren</h2>
            <p class="text-center text-muted mb-4">Maak een nieuw account aan om verder te gaan</p>

            <form (ngSubmit)="register()" method="POST" novalidate>
                <div class="mb-3">
                    <label class="form-label">Voornaam</label>
                    <input type="text" name="name" class="form-control form-control-lg" placeholder="Voornaam"
                        [(ngModel)]="registerForm.name" />
                </div>
                <div class="mb-3">
                    <label class="form-label">Achternaam</label>
                    <input type="text" name="surname" class="form-control form-control-lg" placeholder="Achternaam"
                        [(ngModel)]="registerForm.surname" />

                </div>

                <div class="mb-3">
                    <label class="form-label">Emailadres</label>
                    <input type="email" name="email" class="form-control form-control-lg" placeholder="naam@email.com"
                        [(ngModel)]="registerForm.email" />
                </div>
                <div class="mb-3">
                    <label class="form-label">Wachtwoord</label>
                    <input type="password" name="password" class="form-control form-control-lg" placeholder="••••••••"
                        [(ngModel)]="registerForm.password" />
                    <!-- <% if (errors && errors.password) { %>
					<div class="invalid-feedback"><%= errors.password %></div>
					<% } %> -->
                </div>

                <div class="mb-3">
                    <label class="form-label">Geboortedatum</label>
                    <input type="date" name="birthdate" class="form-control form-control-lg"
                        [(ngModel)]="registerForm.birthDate" />
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm">Registreer</button>
            </form>

            <div class="text-center mt-4">
                <p class="mb-1 text-muted">Heb je al een account?</p>
                <a routerLink="/login" class="fw-bold text-decoration-none">Inloggen</a>
            </div>
        </div>
    </div>
</div>
