@if (modules().length !== 0) {
<div class="row g-4">
    @for (module of modules(); track module.id) {
    <div class="col-6 col-lg-4">
        <app-module-card [module]="module"></app-module-card>
    </div>
    }
</div>
} @else {
@if (isLoading()) {
<p class="spinner-border text-primary d-flex justify-content-center align-items-center" role="status">
    <span class="visually-hidden">Loading...</span>
</p>
} @else {
<p class="text-center text-muted fw-semibold">Geen modules gevonden.</p>
}
}
